name: Downgrade
on:
  pull_request:
    branches: [master, main]
    paths-ignore:
      - 'docs/**'
  push:
    branches: [master, main]
    paths-ignore:
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QUANTUMSAVORY_DOWNGRADE_TEST: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          # PrecompileTools 1.2.1 predates Julia 1.12's world-age changes.
          version: 'min'
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: false
      - uses: julia-actions/julia-downgrade-compat@v2.7.0
        with:
          projects: '.,test'
          skip: LinearAlgebra,Random,SparseArrays
          mode: 'forcedeps'
      - uses: julia-actions/julia-buildpkg@v1
      # Pkg.test can re-resolve split test environments on Julia < 1.12.
      - name: Run tests with locked minimum dependencies
        shell: julia --color=yes --project=test {0}
        run: |
          using Pkg
          Pkg.instantiate()
          Pkg.status(; mode=Pkg.PKGMODE_MANIFEST)
          include(joinpath(pwd(), "test", "runtests.jl"))
